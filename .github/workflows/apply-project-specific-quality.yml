name: Apply Project-Specific Report Quality

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report-quality-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply validated project-specific analysis files
        shell: bash
        run: |
          echo '' | base64 --decode > trending_report/models.py
          echo '' | base64 --decode > trending_report/fallback.py
          echo '' | base64 --decode > trending_report/quality.py
          echo '' | base64 --decode > tests/test_quality.py
      - name: Validate and rebuild history
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m unittest discover -s tests -v
          python -m trending_report reanalyze --days 60 --fallback
      - name: Commit quality upgrade
        shell: bash
        run: |
          git add trending_report/models.py trending_report/fallback.py trending_report/quality.py tests/test_quality.py README.md data reports site
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make project benefits evidence-specific"
          git pull --rebase
          git push
