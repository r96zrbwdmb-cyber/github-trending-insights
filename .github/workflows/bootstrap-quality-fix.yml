name: Apply Report Quality Upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-industry-intelligence-write
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply reviewed source bundle
        shell: bash
        run: |
          mkdir -p 'tests'
          echo '' | base64 --decode > 'tests/test_producthunt.py'
          mkdir -p 'tests'
          echo '' | base64 --decode > 'tests/test_quality.py'
          mkdir -p 'trending_report'
          echo '' | base64 --decode > 'trending_report/email_report.py'
          mkdir -p 'trending_report'
          echo '' | base64 --decode > 'trending_report/fallback.py'
          mkdir -p 'trending_report'
          echo '' | base64 --decode > 'trending_report/models.py'
          mkdir -p 'trending_report'
          echo '' | base64 --decode > 'trending_report/pipeline.py'
          mkdir -p 'trending_report'
          echo '' | base64 --decode > 'trending_report/producthunt.py'
          mkdir -p 'trending_report'
          echo '' | base64 --decode > 'trending_report/quality.py'
      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m ruff check .
          python -m unittest discover -s tests -v
      - name: Rebuild all historical reports
        run: |
          python -m trending_report reanalyze --days 60 --fallback
          python -m trending_report weekly --end-date 2026-08-02
          python -m trending_report weekly --end-date 2026-08-09
          python -m trending_report monthly --month 2026-07
          python -m trending_report build-site
      - name: Commit code and rebuilt history
        shell: bash
        run: |
          git add tests/test_producthunt.py tests/test_quality.py
          git add trending_report/email_report.py trending_report/fallback.py
          git add trending_report/models.py trending_report/pipeline.py
          git add trending_report/producthunt.py trending_report/quality.py
          git add data reports README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: improve report quality and rebuild history"
          git pull --rebase
          git push
