name: Publish Intelligence Page

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "site/**"
      - "trending_report/site.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows:
      - "Daily GitHub Trending Insights"
      - "Daily Product Hunt Business Insights"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build unified page
        run: python -m trending_report build-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
